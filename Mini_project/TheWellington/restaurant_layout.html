<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Layout - Table Selection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        
        .layout-container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        h2 {
            text-align: center;
            color: #8b6f47;
            font-family: 'Georgia', serif;
            margin-bottom: 20px;
            font-size: 28px;
        }
        
        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        
        .legend-box {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            border: 2px solid #333;
        }
        
        .legend-box.available { background: #66bb6a; }
        .legend-box.selected { background: #ffa726; }
        .legend-box.booked { background: #ef5350; }
        
        /* Restaurant Layout SVG Container */
        .restaurant-layout {
            width: 100%;
            background: #faf8f3;
            border: 3px solid #8b6f47;
            border-radius: 10px;
            padding: 20px;
        }
        
        svg {
            width: 100%;
            height: auto;
            display: block;
        }
        
        /* Table Styles */
        .table-group {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .table-group:hover .table-rect {
            stroke-width: 3;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
        }
        
        .table-rect {
            transition: all 0.3s ease;
        }
        
        .table-available .table-rect {
            fill: #66bb6a;
            stroke: #2e7d32;
            stroke-width: 2;
        }
        
        .table-selected .table-rect {
            fill: #ffa726;
            stroke: #f57c00;
            stroke-width: 3;
            filter: drop-shadow(0 4px 8px rgba(255,167,38,0.4));
        }
        
        .table-booked .table-rect {
            fill: #ef5350;
            stroke: #c62828;
            stroke-width: 2;
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .table-number {
            font-size: 24px;
            font-weight: bold;
            fill: white;
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
            font-family: 'Georgia', serif;
        }
        
        .table-capacity {
            font-size: 12px;
            fill: white;
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
        }
        
        /* Room Elements */
        .wall {
            fill: none;
            stroke: #2d5016;
            stroke-width: 4;
        }
        
        .kitchen-area {
            fill: #d4d4d4;
            stroke: #666;
            stroke-width: 2;
        }
        
        .restroom {
            fill: #e3f2fd;
            stroke: #1976d2;
            stroke-width: 2;
        }
        
        .counter {
            fill: #8b6f47;
            stroke: #5d4e37;
            stroke-width: 2;
        }
        
        .cutlery-station {
            fill: #fff9c4;
            stroke: #f57f17;
            stroke-width: 2;
        }
        
        .entry-door {
            fill: #4caf50;
            stroke: #2e7d32;
            stroke-width: 2;
        }
        
        .exit-door {
            fill: #ef5350;
            stroke: #c62828;
            stroke-width: 2;
        }
        
        .window {
            fill: #b3e5fc;
            stroke: #0277bd;
            stroke-width: 2;
            stroke-dasharray: 5,5;
        }
        
        /* Service Path */
        .service-path {
            fill: none;
            stroke: #ffa726;
            stroke-width: 2;
            stroke-dasharray: 10,5;
            opacity: 0.6;
        }
        
        /* Labels */
        .label-text {
            font-size: 14px;
            fill: #333;
            font-weight: bold;
            text-anchor: middle;
        }
        
        .small-label {
            font-size: 11px;
            fill: #666;
            text-anchor: middle;
        }
        
        .icon-text {
            font-size: 20px;
            text-anchor: middle;
            dominant-baseline: middle;
        }
        
        /* Selected Table Info */
        .selected-info {
            margin-top: 25px;
            padding: 20px;
            background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
            border: 2px solid #ffa726;
            border-radius: 10px;
            text-align: center;
        }
        
        .selected-info h3 {
            color: #f57c00;
            margin-bottom: 10px;
            font-size: 20px;
        }
        
        .selected-info p {
            color: #666;
            margin: 5px 0;
            font-size: 16px;
        }
        
        .confirm-btn {
            margin-top: 15px;
            padding: 12px 30px;
            background: #8b6f47;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .confirm-btn:hover {
            background: #6b5438;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(139,111,71,0.3);
        }
        
        .no-selection {
            color: #999;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="layout-container">
        <h2>🍽️ Select Your Table</h2>
        
        <!-- Legend -->
        <div class="legend">
            <div class="legend-item">
                <div class="legend-box available"></div>
                <span>Available</span>
            </div>
            <div class="legend-item">
                <div class="legend-box selected"></div>
                <span>Your Selection</span>
            </div>
            <div class="legend-item">
                <div class="legend-box booked"></div>
                <span>Reserved</span>
            </div>
        </div>
        
        <!-- Restaurant Layout SVG -->
        <div class="restaurant-layout">
            <svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
                <!-- Main Restaurant Walls -->
                <rect class="wall" x="10" y="10" width="880" height="580" rx="5"/>
                
                <!-- Windows (Top Wall) -->
                <rect class="window" x="150" y="10" width="100" height="15"/>
                <rect class="window" x="350" y="10" width="100" height="15"/>
                <rect class="window" x="550" y="10" width="100" height="15"/>
                
                <!-- Entry Door (Bottom Center) -->
                <g>
                    <rect class="entry-door" x="420" y="575" width="60" height="15" rx="3"/>
                    <text x="450" y="568" class="small-label">ENTRY</text>
                </g>
                
                <!-- Kitchen Area (Top Right) -->
                <g>
                    <rect class="kitchen-area" x="650" y="40" width="220" height="200"/>
                    <text x="760" y="80" class="label-text">KITCHEN</text>
                    <text x="760" y="100" class="icon-text">👨‍🍳</text>
                    
                    <!-- Kitchen Equipment Icons -->
                    <rect x="670" y="120" width="40" height="30" fill="#999" rx="3"/>
                    <text x="690" y="135" style="font-size: 16px;">🔥</text>
                    
                    <rect x="720" y="120" width="40" height="30" fill="#999" rx="3"/>
                    <text x="740" y="135" style="font-size: 16px;">❄️</text>
                    
                    <rect x="770" y="120" width="40" height="30" fill="#999" rx="3"/>
                    <text x="790" y="135" style="font-size: 16px;">🥘</text>
                    
                    <rect x="820" y="120" width="40" height="30" fill="#999" rx="3"/>
                    <text x="840" y="135" style="font-size: 16px;">🍳</text>
                    
                    <!-- Kitchen Window (Service Window) -->
                    <rect x="650" y="140" width="15" height="60" fill="#8b6f47" stroke="#5d4e37" stroke-width="2"/>
                    <text x="657" y="170" style="font-size: 10px; fill: white; writing-mode: tb;">PASS</text>
                </g>
                
                <!-- Cashier Counter (Top Right, Below Kitchen) -->
                <g>
                    <rect class="counter" x="650" y="260" width="220" height="60"/>
                    <text x="760" y="280" class="label-text" fill="white">CASHIER COUNTER</text>
                    <text x="760" y="300" style="font-size: 24px;">💳</text>
                </g>
                
                <!-- Cutlery / Tray Station (Right Side) -->
                <g>
                    <rect class="cutlery-station" x="650" y="340" width="220" height="80"/>
                    <text x="760" y="365" class="label-text">CUTLERY STATION</text>
                    <text x="760" y="390" style="font-size: 24px;">🍴</text>
                </g>
                
                <!-- Restrooms (Bottom Right) -->
                <g>
                    <rect class="restroom" x="650" y="440" width="100" height="130"/>
                    <text x="700" y="465" class="label-text">MEN</text>
                    <text x="700" y="490" style="font-size: 32px;">🚹</text>
                    
                    <rect class="restroom" x="770" y="440" width="100" height="130"/>
                    <text x="820" y="465" class="label-text">WOMEN</text>
                    <text x="820" y="490" style="font-size: 32px;">🚺</text>
                </g>
                
                <!-- Exit Doors (Bottom Corners) -->
                <g>
                    <rect class="exit-door" x="50" y="575" width="50" height="15" rx="3"/>
                    <text x="75" y="568" class="small-label" fill="white">EXIT</text>
                </g>
                
                <g>
                    <rect class="exit-door" x="800" y="575" width="50" height="15" rx="3"/>
                    <text x="825" y="568" class="small-label" fill="white">EXIT</text>
                </g>
                
                <!-- Service Paths (Dashed Lines from Kitchen to Tables) -->
                <path class="service-path" d="M 650 140 Q 500 140 400 200"/>
                <path class="service-path" d="M 650 170 Q 550 170 400 300"/>
                <path class="service-path" d="M 650 200 Q 550 250 400 400"/>
                
                <!-- TABLES (2-seater and 4-seater) -->
                
                <!-- Table 1 (2-seater) - Top Left -->
                <g class="table-group table-available" data-table="1" data-capacity="2" onclick="selectTable(1, 2)">
                    <rect class="table-rect" x="80" y="80" width="100" height="70" rx="8"/>
                    <text class="table-number" x="130" y="105">1</text>
                    <text class="table-capacity" x="130" y="130">2 Seats</text>
                </g>
                
                <!-- Table 2 (2-seater) - Top Center Left -->
                <g class="table-group table-available" data-table="2" data-capacity="2" onclick="selectTable(2, 2)">
                    <rect class="table-rect" x="220" y="80" width="100" height="70" rx="8"/>
                    <text class="table-number" x="270" y="105">2</text>
                    <text class="table-capacity" x="270" y="130">2 Seats</text>
                </g>
                
                <!-- Table 3 (4-seater) - Top Center -->
                <g class="table-group table-available" data-table="3" data-capacity="4" onclick="selectTable(3, 4)">
                    <rect class="table-rect" x="360" y="80" width="120" height="80" rx="8"/>
                    <text class="table-number" x="420" y="110">3</text>
                    <text class="table-capacity" x="420" y="135">4 Seats</text>
                </g>
                
                <!-- Table 4 (4-seater) - Top Right -->
                <g class="table-group table-available" data-table="4" data-capacity="4" onclick="selectTable(4, 4)">
                    <rect class="table-rect" x="510" y="80" width="120" height="80" rx="8"/>
                    <text class="table-number" x="570" y="110">4</text>
                    <text class="table-capacity" x="570" y="135">4 Seats</text>
                </g>
                
                <!-- Table 5 (4-seater) - Middle Left -->
                <g class="table-group table-available" data-table="5" data-capacity="4" onclick="selectTable(5, 4)">
                    <rect class="table-rect" x="80" y="220" width="120" height="80" rx="8"/>
                    <text class="table-number" x="140" y="250">5</text>
                    <text class="table-capacity" x="140" y="275">4 Seats</text>
                </g>
                
                <!-- Table 6 (6-seater) - Middle Center -->
                <g class="table-group table-available" data-table="6" data-capacity="6" onclick="selectTable(6, 6)">
                    <rect class="table-rect" x="240" y="220" width="140" height="90" rx="8"/>
                    <text class="table-number" x="310" y="255">6</text>
                    <text class="table-capacity" x="310" y="280">6 Seats</text>
                </g>
                
                <!-- Table 7 (4-seater) - Middle Right -->
                <g class="table-group table-available" data-table="7" data-capacity="4" onclick="selectTable(7, 4)">
                    <rect class="table-rect" x="420" y="220" width="120" height="80" rx="8"/>
                    <text class="table-number" x="480" y="250">7</text>
                    <text class="table-capacity" x="480" y="275">4 Seats</text>
                </g>
                
                <!-- Table 8 (2-seater) - Bottom Center -->
                <g class="table-group table-available" data-table="8" data-capacity="2" onclick="selectTable(8, 2)">
                    <rect class="table-rect" x="240" y="380" width="100" height="70" rx="8"/>
                    <text class="table-number" x="290" y="405">8</text>
                    <text class="table-capacity" x="290" y="430">2 Seats</text>
                </g>
                
                <!-- Decorative Plants -->
                <g>
                    <circle cx="50" cy="100" r="20" fill="#66bb6a" opacity="0.6"/>
                    <text x="50" y="105" style="font-size: 24px;">🌿</text>
                </g>
                <g>
                    <circle cx="600" cy="500" r="20" fill="#66bb6a" opacity="0.6"/>
                    <text x="600" y="505" style="font-size: 24px;">🪴</text>
                </g>
                <g>
                    <circle cx="50" cy="450" r="20" fill="#66bb6a" opacity="0.6"/>
                    <text x="50" y="455" style="font-size: 24px;">🌱</text>
                </g>
            </svg>
        </div>
        
        <!-- Selected Table Information -->
        <div class="selected-info" id="selectedInfo">
            <div class="no-selection">
                <h3>👆 Click on a table to select</h3>
                <p>Choose an available table for your reservation</p>
            </div>
        </div>
    </div>
    
    <script>
        let selectedTableNumber = null;
        let selectedTableCapacity = null;
        
        // Get URL parameters for date/time
        const urlParams = new URLSearchParams(window.location.search);
        const date = urlParams.get('date') || '';
        const time = urlParams.get('time') || '';
        
        // Fetch booked tables if date/time provided
        let bookedTables = [];
        if (date) {
            fetch(`get_booked_tables.php?date=${encodeURIComponent(date)}${time ? '&time=' + encodeURIComponent(time) : ''}`)
                .then(response => response.json())
                .then(data => {
                    if (data.success && data.bookedTables) {
                        bookedTables = data.bookedTables;
                        initializeBookedTables();
                    }
                })
                .catch(error => {
                    console.error('Error fetching booked tables:', error);
                });
        }
        
        // Initialize booked tables
        function initializeBookedTables() {
            bookedTables.forEach(tableNum => {
                const tableGroup = document.querySelector(`[data-table="${tableNum}"]`);
                if (tableGroup) {
                    tableGroup.classList.remove('table-available');
                    tableGroup.classList.add('table-booked');
                    tableGroup.onclick = null; // Disable clicking
                }
            });
        }
        
        function selectTable(tableNumber, capacity) {
            // Check if table is booked
            const tableGroup = document.querySelector(`[data-table="${tableNumber}"]`);
            if (tableGroup.classList.contains('table-booked')) {
                alert('This table is already reserved. Please select another table.');
                return;
            }
            
            // Remove previous selection
            document.querySelectorAll('.table-group').forEach(group => {
                group.classList.remove('table-selected');
            });
            
            // Add selection to clicked table
            tableGroup.classList.add('table-selected');
            
            selectedTableNumber = tableNumber;
            selectedTableCapacity = capacity;
            
            // Update info display
            updateSelectedInfo();
        }
        
        function updateSelectedInfo() {
            const infoDiv = document.getElementById('selectedInfo');
            
            if (selectedTableNumber) {
                infoDiv.innerHTML = `
                    <h3>✅ Table ${selectedTableNumber} Selected</h3>
                    <p><strong>Capacity:</strong> ${selectedTableCapacity} Seats</p>
                    <p style="color: #8b6f47; font-weight: bold;">Table Number: ${selectedTableNumber}</p>
                    <button class="confirm-btn" onclick="confirmTableSelection()">
                        Confirm Table Selection
                    </button>
                `;
            } else {
                infoDiv.innerHTML = `
                    <div class="no-selection">
                        <h3>👆 Click on a table to select</h3>
                        <p>Choose an available table for your reservation</p>
                    </div>
                `;
            }
        }
        
        function confirmTableSelection() {
            if (!selectedTableNumber) {
                alert('Please select a table first');
                return;
            }
            
            // Send selected table to parent window (reservation.php)
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    action: 'tableSelected',
                    tableNumber: selectedTableNumber,
                    capacity: selectedTableCapacity
                }, '*');
                
                // Close modal in parent
                if (window.parent.closeLayoutModal) {
                    window.parent.closeLayoutModal();
                }
            } else {
                // Fallback: Store in localStorage
                localStorage.setItem('selectedTable', selectedTableNumber);
                localStorage.setItem('selectedTableCapacity', selectedTableCapacity);
                
                alert(`Table ${selectedTableNumber} confirmed!\nCapacity: ${selectedTableCapacity} seats\n\nYou can now continue with your reservation.`);
            }
        }
        
        // Listen for messages from parent window
        window.addEventListener('message', function(event) {
            if (event.data.action === 'setBookedTables') {
                bookedTables.length = 0;
                bookedTables.push(...event.data.tables);
                initializeBookedTables();
            }
        });
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Check if table was pre-selected from URL
            const preSelectedTable = urlParams.get('table');
            if (preSelectedTable) {
                const tableNum = parseInt(preSelectedTable);
                const tableGroup = document.querySelector(`[data-table="${tableNum}"]`);
                if (tableGroup && !tableGroup.classList.contains('table-booked')) {
                    const capacity = tableGroup.getAttribute('data-capacity');
                    selectTable(tableNum, parseInt(capacity));
                }
            }
        });
    </script>
</body>
</html>
